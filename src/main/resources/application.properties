spring.application.name=aurea

# H2 File Database
spring.datasource.url=jdbc:h2:file:./data/aurea;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# OpenAI (dummy key for development)
OPENAI_API_KEY=sk-dummy-key-for-local-testing-only
